workflow:
  rules:
    # Run the generic CI on merge requests only
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

stages:
  - build
  - test
  - check

include:

  #########
  # BUILD #
  #########

  # Build GNATformat and save the component for the ALS check job
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/build@~latest
    inputs:
      anod-args: run build_$ACI_TRACK
      save-component: true

  # Build the coverage-instrumented GNATformat and save the component for the
  # coverage testsuite job
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/build@~latest
    inputs:
      job-name: build-cov
      anod-args: run build_cov_$ACI_TRACK
      save-component: true

  # Build ALS reusing the component built by build:linux
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/build@~latest
    inputs:
      job-name: build-als
      anod-args: run build_als_$ACI_TRACK
      needs: [build:linux]
      cpus: 16
      # Build the ALS from the head of its git repository instead of the
      # nightly source package, so that ALS fixes for coordinated GNATformat
      # changes are picked up as soon as they are merged.
      # Depends-On still wins. generic_anod_ci processes MR-description
      # dependencies before --add-dep entries and gives them priority.
      generic-anod-ci-args: --add-dep eng/ide/ada_language_server

  # Build the user manual, only when its sources change
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/build@~latest
    inputs:
      job-name: build-doc
      anod-args: run build_doc_$ACI_TRACK
      rules:
        - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
          changes:
            - user_manual/**/*

  ########
  # TEST #
  ########

  # Run the testsuite in coverage mode, reusing the component built by
  # build-cov:linux
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/test@~latest
    inputs:
      job-name: test-cov
      anod-args: run test_cov_$ACI_TRACK
      needs: [build-cov:linux]

  #########
  # CHECK #
  #########

  # Check that the MR references a GitLab issue
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/check-issue@~latest

  # Check that the sources are properly formatted
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/gnatformat@~latest
    inputs:
      stage: check
      anod-spec: gnatformat $ACI_TRACK_QUALIFIER
      gnatformat-args: -P gnat/gnatformat_driver.gpr --check
      install-gnatformat: true
      install-gnatformat-extra-anod-args: -Qedge
  - component: $CI_SERVER_FQDN/it/gitlab-templates/gitleaks@~latest
    inputs:
      stage: check

# Publish the coverage reports produced by the coverage testsuite run
test-cov:linux:
  variables:
    RUNNER_AFTER_SCRIPT_TIMEOUT: 10m
  after_script:
    # Source the env prepared by generic_anod_ci
    - . /tmp/ci_env.sh
    - GNATFORMAT_BUILD_SPACE=$(anod info test gnatformat $ACI_TRACK_QUALIFIER -Q coverage --show working_dir)
    - RESULTS_DIR=$GNATFORMAT_BUILD_SPACE/results/new
    # Save coverage results
    - mkdir -v $CI_PROJECT_DIR/coverage
    - cp -rv $RESULTS_DIR/coverage-cobertura $CI_PROJECT_DIR/coverage/
    - cp -rv $RESULTS_DIR/coverage-xml $CI_PROJECT_DIR/coverage/
    # Display coverage stats; the coverage regex below picks up the statement
    # coverage. Decision coverage remains visible in this output and in the
    # published reports.
    - echo_coverage_stats --coverage-file $RESULTS_DIR/coverage-xml/index.xml
    # Export to gitlab pages
    - |
      if [[ $CI_PIPELINE_SOURCE = "merge_request_event" ]]; then
        target_subdir=MRs/$CI_MERGE_REQUEST_IID
      else
        target_subdir=$CI_COMMIT_BRANCH
      fi
    - target_subdir=$target_subdir/ada-coverage
    - publish-pages $RESULTS_DIR/coverage-dhtml/ --target-subdir $target_subdir --expires 30
  coverage: '/^Stmt Coverage:\s+(\d+\.\d+\%) \(\d+ \/ \d+\)$/'
  artifacts:
    when: always # Upload on errors too
    reports:
      junit: xunit-*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/coverage-cobertura/cobertura.xml
    paths:
      - coverage/
      - anod-logs/

# Save the user manual built by build-doc:linux in the job artifacts, and
# publish its HTML version to GitLab pages. Override the artifact paths of the
# build component, which contain a variable that expose_as does not support.
build-doc:linux:
  variables:
    RUNNER_AFTER_SCRIPT_TIMEOUT: 10m
  after_script:
    # Source the env prepared by generic_anod_ci
    - . /tmp/ci_env.sh
    - BUILD_SPACE=$(anod eval gnatformat-doc --primitive build build_space_name $ACI_TRACK_QUALIFIER)
    - cp -rv $ANOD_DEFAULT_SANDBOX_DIR/x86_64-linux/$BUILD_SPACE/install $CI_PROJECT_DIR/user_manual_build
    # Export to gitlab pages
    - |
      if [[ $CI_PIPELINE_SOURCE = "merge_request_event" ]]; then
        target_subdir=MRs/$CI_MERGE_REQUEST_IID
        expires=7
      else
        target_subdir=$CI_COMMIT_BRANCH
        expires=90
      fi
    - target_subdir=$target_subdir/user-manual
    - publish-pages $CI_PROJECT_DIR/user_manual_build/html/ --target-subdir $target_subdir --expires $expires
    - echo "User manual - https://pages.gitlab.adacore-it.com/eng/ide/gnatformat/$target_subdir/index.html"
  artifacts:
    expose_as: "User manual"
    paths:
      - user_manual_build/
      - anod-logs/
